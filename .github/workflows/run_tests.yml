name: "Run Tests"

on:
  push:
    branches:
      - main
    paths:
      - "tutorials/**"
      - "dlordinal/**"
      - ".github/workflows/**"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
    paths:
      - "tutorials/**"
      - "dlordinal/**"
      - ".github/workflows/**"
      - "pyproject.toml"

jobs:
  pytest:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macOS-15, windows-2025 ]
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run tests
      run: python -m pytest -n auto

  pytest-gpu:
    runs-on: [gpu]
    env:
      PYTEST_CUDA_ONLY: "1"

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    # Every pytest-xdist worker creates its own CUDA context (~250-300 MB of GPU
    # memory before any test runs). With -n auto (32 workers on the GPU runner) and
    # several matrix jobs sharing the GPU, contexts alone exhausted its memory and
    # tests failed with "CUDA error: out of memory" / CUBLAS_STATUS_ALLOC_FAILED.
    # A fixed, small number of workers keeps each job at ~1 GB of contexts.
    - name: Run tests
      run: gpu-run.sh python -m pytest -n 4 -m "not no_gpu_ci"

  tests-codecov:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run tests for codecov
      run: |
        pytest --cov=dlordinal --cov-report=xml
      timeout-minutes: 20

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  tests-dev-docs:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev,docs]

    - name: Run tests
      run: |
        pytest
      timeout-minutes: 20
